<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIS Website — Coach AI Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --vis-navy: #0c1e3d;
        --vis-green: #4ade80;
        --bg: #f8f9fb;
      }
      * { box-sizing: border-box; }
      body {
        font-family: Inter, 'Segoe UI', system-ui, sans-serif;
        margin: 0;
        background: var(--bg);
        color: #111827;
      }
      .site-nav {
        background: #fff;
        border-bottom: 1px solid #e5e7eb;
        padding: 0 24px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .site-nav strong { color: var(--vis-navy); }
      .site-cta {
        background: var(--vis-green);
        color: #0c1e3d;
        font-size: 13px;
        font-weight: 700;
        padding: 8px 18px;
        border-radius: 999px;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 24px;
      }
      main h1 {
        color: var(--vis-navy);
        font-size: 28px;
      }
      main h1 span { color: #22c55e; }
      main p { color: #6b7280; line-height: 1.65; }
      iframe {
        position: fixed;
        right: 0;
        bottom: 0;
        width: 400px;
        height: 600px;
        border: 0;
        background: transparent;
        z-index: 99999;
      }
    </style>
  </head>
  <body>
    <nav class="site-nav">
      <strong>Vetri IT Systems</strong>
      <span class="site-cta">Coach AI</span>
    </nav>
    <main>
      <h1>Coach AI <span>Widget</span></h1>
      <p>
        This page simulates the VIS website with the Coach AI chatbot embedded
        in the bottom-right corner — matching the Figma design.
      </p>
    </main>
    <iframe src="/?embed=1" title="Coach AI"></iframe>
  </body>
</html>
