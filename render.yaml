# Optional Render Blueprint. You can also create the services in the dashboard.

databases:
  - name: vetri-chatbot-db
    plan: free
    databaseName: vetri_chatbot
    user: vetri_chatbot

services:
  - type: web
    name: vetri-chatbot-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py ensure_superuser
    startCommand: gunicorn config.wsgi:application --timeout 120 --workers 1
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
        # Render generateValue produces a long random secret (meets 50+ char requirement).
      - key: DATABASE_URL
        fromDatabase:
          name: vetri-chatbot-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: vetri-chatbot-1.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://vetri-chatbot-ui.onrender.com,https://vetriitsystems.com,https://www.vetriitsystems.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://vetri-chatbot-1.onrender.com
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.6-flash
      - key: GEMINI_MAX_RETRIES
        value: "2"
      - key: GEMINI_RAG_LIMIT
        value: "4"
      - key: ENQUIRY_NOTIFY_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        sync: false

  - type: web
    name: vetri-chatbot-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://vetri-chatbot-1.onrender.com
